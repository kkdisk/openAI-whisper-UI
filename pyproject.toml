[project]
name = "local-meeting-transcriber"
version = "0.5.0"
description = "本機離線會議逐字稿工具"
requires-python = ">=3.10,<3.11"
dependencies = [
  "faster-whisper>=1.1,<2",
  "av>=14,<17",
  "ctranslate2>=4.4,<5",
  "onnxruntime>=1.20,<2",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "huggingface-hub>=0.28,<1",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12==12.6.4.1 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.5.1.17 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: 須明確指定 --gpu 的 CUDA 實機測試",
  "windows: Windows 子程序及 Job Object 整合測試",
  "real_model: 須明確指定 --real-model 的本機模型測試",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".uv-cache", ".uv-pristine", "models", "data", "temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
